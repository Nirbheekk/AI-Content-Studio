services:
  postgres:
    image: postgres:16-alpine
    container_name: aicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicos_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_os}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-network
      - render-sandbox-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aicos} -d ${POSTGRES_DB:-ai_content_os}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aicos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network
      - render-sandbox-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: elestio/minio:latest
    container_name: aicos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-network
      - render-sandbox-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aicos-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_minimum_32_characters_long_for_local_testing_only}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edge-network
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: aicos-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    image: aicos-worker:latest
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: aicos-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_ROLE: general
      WORKER_PORT: 4010
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-orchestrator:
    image: aicos-worker:latest
    container_name: aicos-ai-orchestrator
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_ROLE: orchestrator
      WORKER_PORT: 4011
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4011/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-worker:
    image: aicos-worker:latest
    container_name: aicos-media-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_ROLE: media
      WORKER_PORT: 4012
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4012/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  rendering-worker:
    build:
      context: .
      dockerfile: docker/rendering-worker.Dockerfile
    container_name: aicos-rendering-worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_ROLE: rendering
      WORKER_PORT: 4013
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - render-sandbox-network
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4013/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  publishing-worker:
    image: aicos-worker:latest
    container_name: aicos-publishing-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WORKER_ROLE: publishing
      WORKER_PORT: 4014
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicos}:${POSTGRES_PASSWORD:-aicos_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-ai_content_os}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4014/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: aicos-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - edge-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edge-network:
    driver: bridge
  backend-network:
    driver: bridge
  render-sandbox-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
