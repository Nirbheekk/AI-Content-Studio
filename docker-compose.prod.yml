services:
  postgres:
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  redis:
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  minio:
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  api:
    environment:
      NODE_ENV: production
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    environment:
      NODE_ENV: production
    ports: !override []
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  ai-orchestrator:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  media-worker:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  rendering-worker:
    environment:
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp/remotion:size=2G,mode=1777
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  publishing-worker:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  nginx:
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

networks:
  render-sandbox-network:
    internal: true
