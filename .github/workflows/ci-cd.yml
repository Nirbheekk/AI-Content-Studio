name: CI/CD — Verify, Scan & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/aicos

jobs:
  verify:
    name: Lint, Typecheck, Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aicos
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: ai_content_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aicos -d ai_content_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency security audit
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build packages
        run: pnpm run build

      - name: Generate Prisma client & run migrations
        env:
          DATABASE_URL: postgresql://aicos:ci_postgres_password@localhost:5432/ai_content_os?schema=public
        run: pnpm --filter @ai-content-os/database db:deploy

      - name: Run automated tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aicos:ci_postgres_password@localhost:5432/ai_content_os?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_jwt_secret_minimum_32_characters_long_for_tests
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: pnpm exec turbo run test

  docker-build-and-scan:
    name: Build & Scan Docker Images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
          - service: frontend
            dockerfile: docker/web.Dockerfile
          - service: worker
            dockerfile: docker/worker.Dockerfile
          - service: rendering-worker
            dockerfile: docker/rendering-worker.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push immutable image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy-production:
    name: Deploy to Production (Manual Gate)
    needs: docker-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy immutable SHA release via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/ai-content-studio
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull
            ./scripts/deploy-prod.sh
            curl -sfk https://127.0.0.1/api/ready
